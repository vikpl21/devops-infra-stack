---
- name: Install ELK Stack on devops VM
  hosts: devops_vm
  become: true

  vars:
    elk_version: "8.13.0"

  tasks:
    - name: Create /opt/elk directory
      file:
        path: /opt/elk
        state: directory
        mode: '0755'

    - name: Copy ELK docker-compose file
      copy:
        dest: /opt/elk/docker-compose.yml
        mode: '0644'
        content: |
          version: '3.8'

          services:
            elasticsearch:
              image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
              container_name: elasticsearch
              restart: unless-stopped
              environment:
                - discovery.type=single-node
                - xpack.security.enabled=false
                - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
              ports:
                - "9200:9200"
              volumes:
                - esdata:/usr/share/elasticsearch/data
              networks:
                - elk

            logstash:
              image: docker.elastic.co/logstash/logstash:8.13.0
              container_name: logstash
              restart: unless-stopped
              ports:
                - "5044:5044"
                - "5000:5000/udp"
              volumes:
                - /opt/elk/logstash/pipeline:/usr/share/logstash/pipeline
              networks:
                - elk
              depends_on:
                - elasticsearch

            kibana:
              image: docker.elastic.co/kibana/kibana:8.13.0
              container_name: kibana
              restart: unless-stopped
              environment:
                - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
              ports:
                - "5601:5601"
              networks:
                - elk
              depends_on:
                - elasticsearch

          volumes:
            esdata:

          networks:
            elk:
              driver: bridge

    - name: Create Logstash pipeline directory
      file:
        path: /opt/elk/logstash/pipeline
        state: directory
        mode: '0755'

    - name: Create Logstash pipeline config
      copy:
        dest: /opt/elk/logstash/pipeline/logstash.conf
        content: |
          input {
            udp {
              port => 5000
              codec => json
            }
          }

          filter {
            if [message] {
              mutate {
                add_field => { "processed_by" => "logstash" }
              }
            }
          }

          output {
            elasticsearch {
              hosts => ["http://elasticsearch:9200"]
              index => "devops-logs-%{+YYYY.MM.dd}"
            }
            stdout {
              codec => rubydebug
            }
          }

    - name: Set vm.max_map_count for Elasticsearch
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: yes

    - name: Start ELK Stack
      community.docker.docker_compose_v2:
        project_src: /opt/elk
        state: present
      register: elk_output

    - name: Wait for Elasticsearch to be ready
      uri:
        url: "http://localhost:9200"
        method: GET
        status_code: 200
      register: es_result
      until: es_result.status == 200
      retries: 15
      delay: 10

    - name: Elasticsearch is ready
      debug:
        msg: "✅ Elasticsearch is up and running!"
